data_dir: data/anns
trace_dir: data/anns/res
query_trace_map: data/anns/query_trace_map_5k.json
config_for_run: data/run_log/anns/H100_enhanced_schedulers_v1_full/mcps_lce
use_saved_poisson_delays: experiments/anns/configs/H100_enhanced_schedulers_v1_full/poisson_delays_0_5.txt
prefix_caching_flag: false
scheduler: mcps_lce
log_stats: true
query_range: 500
model:
  name: meta-llama/Meta-Llama-3.1-8B-Instruct
  max_token_budget: 8192
  gpu_memory_utilization: 0.8
  tensor_parallel_size: 2
  seed: 42
replay:
  poisson_avg_arrival_time: 0.5
  max_output_tokens: 1
  delay_multiplier: 1.0
  template: 'Answer the question based only on the provided context. If the answer
    is not in the context, say "I don''t know."

    Context:'
  end_template: '


    Question:'
logging:
  verbose_console: false
  suppress_vllm_logs: true
experiments:
- concurrency: true
  stream: true
use_recomputation_latency_predictor: 1
use_saved_recomputation_data_path: data/perf_model/recomputation/H200_tp2_recomputation_latency.json
use_swap_latency_predictor: 1
use_saved_swap_latency_data_path: data/perf_model/swap/H200_tp2_swap_kernel_latency.json
use_swap_kernel: 1
