trace_dir: data/crawl/traces/simpleQA_ALL
config_for_run: data/run_log/crawler/H100_enhanced_schedulers_v1_full/mcps
use_saved_poisson_delays: experiments/crawler/configs/H100_enhanced_schedulers_v1_full/poisson_delays_0_2.txt
prefix_caching_flag: false
scheduler: mcps
log_stats: true
model:
  name: meta-llama/Meta-Llama-3.1-8B-Instruct
  max_token_budget: 2048
  gpu_memory_utilization: 0.8
  tensor_parallel_size: 2
replay:
  poisson_avg_arrival_time: 0.2
  max_output_tokens: 1
  template: |
    Answer the question based only on the provided context. If the answer is not in the context, say "I don't know."
    Context:
  end_template: |

    Question:
experiments:
- concurrency: true
  stream: true
use_recomputation_latency_predictor: 1
use_saved_recomputation_data_path: data/perf_model/recomputation/H100_tp2_recomputation_latency.json
use_swap_latency_predictor: 1
use_saved_swap_latency_data_path: data/perf_model/swap/H100_tp2_swap_kernel_latency.json
use_swap_kernel: 1
