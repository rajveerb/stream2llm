trace_dir: data/crawl/traces/simpleQA_ALL
config_for_run: data/run_log/crawler/H200_enhanced_schedulers_v1_full_delay_10/default_vllm
use_saved_poisson_delays: experiments/crawler/configs/H200_enhanced_schedulers_v1_full_delay_10/poisson_delays_0_25.txt
prefix_caching_flag: false
scheduler: default_vllm
log_stats: true
model:
  name: meta-llama/Meta-Llama-3.1-8B-Instruct
  max_token_budget: 2048
  gpu_memory_utilization: 0.8
  tensor_parallel_size: 2
replay:
  poisson_avg_arrival_time: 0.25
  max_output_tokens: 1
  delay_multiplier: 10.0
  template: 'Answer the question based only on the provided context. If the answer
    is not in the context, say "I don''t know."

    Context:

    '
  end_template: '

    Question:

    '
logging:
  verbose_console: false
  suppress_vllm_logs: true
experiments:
- concurrency: true
  stream: true
- concurrency: true
  stream: false
use_recomputation_latency_predictor: 1
use_saved_recomputation_data_path: data/perf_model/recomputation/H200_tp2_recomputation_latency.json
use_swap_latency_predictor: 1
use_saved_swap_latency_data_path: data/perf_model/swap/H200_tp2_swap_kernel_latency.json
use_swap_kernel: 1
